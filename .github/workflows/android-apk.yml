name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build
       - name: Debug build output
  run: |
    echo "===== .output ====="
    ls -R .output || true
    echo "===== dist ====="
    ls -R dist || true
    echo "===== public ====="
    ls -R public || true
      - name: Prepare www folder for Capacitor
        run: |
          rm -rf www
          mkdir -p www
          # TanStack Start static output lives in .output/public.
          # If your build output is elsewhere, adjust this copy.
          if [ -d ".output/public" ]; then
            cp -R .output/public/. www/
          elif [ -d "dist" ]; then
            cp -R dist/. www/
          else
            echo "Build output not found (.output/public or dist)"; exit 1
          fi
          # Capacitor requires an index.html entry point.
          if [ ! -f "www/index.html" ]; then
            echo "www/index.html missing — SSR-only build. Add a static index.html or enable prerender."; exit 1
          fi

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybertraffic-pro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
