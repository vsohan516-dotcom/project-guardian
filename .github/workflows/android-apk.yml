
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build Capacitor Web Assets
        run: bun run build:capacitor

      - name: Debug build output
        run: |
          echo "===== dist/client ====="
          ls -R dist/client || true

          echo "===== .output/public ====="
          ls -R .output/public || true

          echo "===== dist ====="
          ls -R dist || true

          echo "===== public ====="
          ls -R public || true

      - name: Prepare www folder
        run: |
          rm -rf www
          mkdir -p www

          if [ -d "dist/client" ]; then
            cp -R dist/client/. www/
          elif [ -d ".output/public" ]; then
            cp -R .output/public/. www/
          elif [ -d "dist" ]; then
            cp -R dist/. www/
          else
            echo "No build output found!"
            exit 1
          fi

          echo "===== WWW ====="
          ls -R www || true

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybertraffic-pro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

          
